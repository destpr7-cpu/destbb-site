<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>dest.bb — админ-панель</title>
  <style>
    :root{color-scheme:dark;--bg:#090909;--panel:#111;--line:#292929;--muted:#999;--white:#f4f4f4;--red:#d71930}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1240px)/2))}.brand{font-size:22px;font-weight:900}.top small{color:var(--muted)}main{max-width:1240px;margin:34px auto;padding:0 22px}.login{max-width:420px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);padding:28px}.login h1,.heading h1{margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.field{display:grid;gap:7px;margin:14px 0}.field label{color:#bbb;font-size:12px}.field input,.field textarea,.field select{width:100%;background:#090909;color:#fff;border:1px solid #383838;padding:11px}.field textarea{min-height:100px;resize:vertical}.btn{border:1px solid #444;background:#171717;color:#fff;padding:10px 15px}.btn.primary{background:#fff;border-color:#fff;color:#080808;font-weight:700}.btn.danger{border-color:#6a2630;color:#ffadb7}.btn:disabled{opacity:.5;cursor:not-allowed}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.layout{display:grid;grid-template-columns:300px 1fr;gap:20px}.list,.editor{background:var(--panel);border:1px solid var(--line)}.list{padding:10px;align-self:start}.product-choice{width:100%;text-align:left;padding:13px;border:0;border-bottom:1px solid #252525;background:transparent;color:#ddd}.product-choice.active{background:#202020;color:white}.editor{padding:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.span2{grid-column:1/-1}.checks{display:flex;gap:20px;flex-wrap:wrap;padding:12px 0}.checks label{display:flex;align-items:center;gap:9px}.checks input{accent-color:white;width:17px;height:17px}.images{display:flex;gap:10px;flex-wrap:wrap}.image-tile{position:relative;width:105px;height:105px;border:1px solid #333;background:#080808}.image-tile img{width:100%;height:100%;object-fit:cover}.image-tile button{position:absolute;right:4px;top:4px;background:#000d;border:0;color:white}.savebar{display:flex;gap:9px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:22px;padding-top:18px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.status{min-height:18px;color:#bbb;font-size:13px}.empty{padding:28px;color:var(--muted);text-align:center}.stock-row{display:grid;grid-template-columns:85px 1fr;gap:10px;align-items:center;margin:7px 0}.stock-row input{max-width:130px}.hidden{display:none!important}@media(max-width:760px){main{margin:20px auto;padding:0 12px}.layout{grid-template-columns:1fr}.list{display:flex;overflow:auto}.product-choice{min-width:150px;border-bottom:0;border-right:1px solid #252525}.editor{padding:15px}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}.toolbar{align-items:flex-start}.toolbar .btn{white-space:nowrap}}
  .tabs{display:flex;gap:8px;margin:20px 0}.tab.active{background:#fff;color:#000}.orders{display:grid;gap:12px}.order-card{background:var(--panel);border:1px solid var(--line);padding:18px}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.order-head b{font-size:16px}.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:15px 0;color:#bbb;font-size:13px;line-height:1.55}.order-card ul{margin:7px 0;padding-left:20px}.order-card .status-pill{display:inline-block;padding:5px 9px;border:1px solid #555;color:#ddd;font-size:11px}@media(max-width:760px){.order-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">dest.bb <small>/ admin</small></div><button id="logout" class="btn hidden">Выйти</button></header>
  <main>
    <section id="login" class="login"><h1>Вход в админку</h1><p class="muted">Управление товарами магазина</p><form id="loginForm"><div class="field"><label for="password">Пароль администратора</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Войти</button><p id="loginStatus" class="status" role="status"></p></form></section>
    <section id="app" class="hidden"><div class="tabs"><button id="productsTab" class="btn tab active">Товары</button><button id="ordersTab" class="btn tab">Заказы</button></div><div id="productsView"><div class="toolbar"><div class="heading"><h1>Товары</h1><div class="muted">Цены, скидки, остатки, предзаказ и фотографии</div></div><button id="addProduct" class="btn primary">＋ Добавить товар</button></div><div class="layout"><nav id="productList" class="list" aria-label="Список товаров"></nav><form id="productForm" class="editor"><div class="empty">Выбери товар слева или добавь новый.</div></form></div></div><div id="ordersView" class="hidden"><div class="toolbar"><div class="heading"><h1>Заказы</h1><div class="muted">Остатки списываются, когда отметишь заказ оплаченным</div></div><button id="refreshOrders" class="btn">Обновить</button></div><div id="ordersList" class="orders"></div></div><p id="appStatus" class="status" role="status"></p></section>
  </main>
  <script src="/admin.js" defer></script>
</body>
</html>
